    Resolved: 2S battery configuration and all limits ratified as drafted. Build-time check retained as a verification item: each limit must catch its fault case (string failure eventually crosses the SoC yellow; stuck-on load crosses EPS_LOAD_I yellow before red).
  - |-
    Resolved: 16 points confirmed as the v0.1 set. Deliberately excluded until v0.2: battery temperature (thermal excluded), per-load current breakdown, ground-side uplink counters.
  - |-
    Resolved: staleness thresholds 10 s yellow / 30 s red, married to PROC-003 decision points.
  - |-
    Ground station named GS-RAVENSROOST (fictional single terminal, central Florida coordinates recorded in the repo).
  - |-
    Resolved (2026-07-25, FMEA v0.2 REC-01): CMD_MODE_SET added as the fifth command with the mode-authority rule above; recovery floors 35% (NOMINAL) / 25% (LOW_POWER) ratified with the FMEA disposition.
  - |-
    Resolved (2026-07-25, HUG-G001 F-04/F-05, owner: accept/product): CMD_SYS_RESET post-reset counter epoch (ACC=1/REJ=0) defined as the reset acknowledgement; command accounting bound to the HUG-CMD-007 exactly-once contract with ≤1-frame visibility and the 10 s PROC-003 threshold.
