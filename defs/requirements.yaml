  - |-
    Resolved: mode ladder ratified (NOMINAL → LOW_POWER at 30% → SAFE at 20%; payload activation inhibit below 40%).
  - |-
    Resolved: command-safety pattern ratified (SAFE_ENTER always accepted onboard; SAFE_ENTER and SYS_RESET flagged hazardous in OpenC3 with two-step ground confirmation).
  - |-
