# =============================================================================
# HUGINN v0.1 - requirements SINGLE SOURCE
#
# docs/requirements.md is a GENERATED VIEW of this file:
#   tools/gen_requirements.py -> docs/requirements.md
#
# Obligation B2. The document's own header states the rule - the markdown is the
# drafting surface only, and becomes a generated view at build. It is now that
# view; editing it directly is prohibited, regenerate instead.
#
# Phase 6 (B3, HUG-VER-001) generates the traceability matrix with this file as
# its spine. Upstream citations are NOT duplicated into a separate field: the
# trace cell is the one source, and hugdefs.trace_tokens() parses the NEED / CON /
# ASM / HUG- identifiers out of it. One source cannot disagree with itself.
#
# Requirement text and dispositioned content are the frozen HUG-G001 record.
# Changing any of it requires an owner ruling, not an edit.
# =============================================================================

# One identity: equals the version in the generated document's title line.
requirements_version: '0.13'

document:
  system_title: 'HUGINN: CubeSat Mission Operations Simulator'
  doc_title: 'Requirements, Skeleton'
  ledger_heading: 'all items resolved by owner, 2026-07-24'
  status: |-
    v0.13, revision per owner ruling D-019 (2026-10-12): HUG-SYS-006 is struck in place — its identifier and text are kept and marked struck, and the traceability matrix shows it struck. Prior revision v0.12, HUG-G001-15 fix revision per Director disposition 2026-07-29 (accept/product): G001-15 F-01 → the two replay obligations are separated — HUG-SYS-006 binds ground-system replay to the ground system's native timestamped log recording and playback, with playback as the demonstration evidence, and states that the recorder-to-viewer replay package is a separate interface that does not discharge it. Prior revisions: v0.11 (G001-10 fix: state-conditional decision evidence), v0.10 (G001-09 fix: the omitted state), v0.9 (G001-08 fix), v0.8 (G001-07 fixes), v0.7 (G001-06 fix), v0.6 (G001-03 fixes), v0.5 (G001-02 fixes), v0.4 (G001 fixes), v0.3 (FMEA-driven), v0.2 (ratified values). All previously ratified parameter values unchanged. This markdown file is the drafting surface only; before build, requirements move to `defs/requirements.yaml` as the single source, and this document becomes a generated view.
  verification_methods: |-
    T = Test (executed checker), A = Analysis, I = Inspection, D = Demonstration (documented pass execution).
  traceability_rule: |-
    every requirement traces up to a NEED-nn from the CONOPS and down to a checker, procedure, or campaign artifact. The matrix is generated by `tools/gen_traceability.py` from requirement IDs referenced in code and documents. Hand-maintained matrices are prohibited. Every T-verified requirement's checker must be demonstrated to fail when its condition is violated (negative check) before its passing result counts.

# -----------------------------------------------------------------------------
# Requirement groups, in record order. Row order within a group is the record's
# order and is NOT sorted: HUG-UI-007 precedes HUG-UI-006 in the record, and
# sorting by identifier would silently reorder the record.
#
# verification: T = Test (executed checker), A = Analysis, I = Inspection,
#               D = Demonstration (documented pass execution)
#
# struck: 'D-nnn' (optional) - the requirement is struck in place by that owner
#               ruling. Its identifier and text stay, so every citation of it
#               still resolves and its cases still run, and it is no longer an
#               obligation of the release. The ruling must be in DECISIONS.md
#               (G8). The traceability matrix shows the row STRUCK and exempts it
#               from F1, F2, F5 and F6; it counts toward no CONOPS coverage and
#               lifts no other requirement to a NEED. First used by D-019.
# -----------------------------------------------------------------------------
groups:
  - id: HUG-SYS
    name: 'System'
    requirements:
      - id: HUG-SYS-001
        verification: ['T']
        trace: 'NEED-02, NEED-03'
        text: |-
          The simulator shall model a 6U CubeSat electrical power subsystem comprising two solar-array strings, one battery, a regulated bus, and switchable loads, at a time step of 1 s or finer.
      - id: HUG-SYS-002
        verification: ['T']
        trace: 'NEED-01; ASM-03'
        text: |-
          The simulator shall propagate spacecraft position from the pinned surrogate reference element set stored in `defs/orbit/`, and shall derive eclipse state and ground-terminal visibility from that propagation.
      - id: HUG-SYS-003
        verification: ['T']
        trace: 'NEED-04; ASM-01'
        text: |-
          For a given scenario file (seed, fault schedule, start epoch), simulation results shall be bit-for-bit reproducible across runs.
      - id: HUG-SYS-004
        verification: ['T']
        trace: 'NEED-02'
        text: |-
          The simulator shall support real-time and accelerated-time execution with identical model results for the same scenario.
      - id: HUG-SYS-005
        verification: ['I', 'T']
        trace: 'NEED-04'
        text: |-
          Fault injections shall be defined entirely in scenario files; injecting a fault shall require no source-code change.
      - id: HUG-SYS-006
        verification: ['D']
        trace: 'NEED-04; G001-15 F-01'
        struck: 'D-019'
        text: |-
          Every campaign session shall be recorded such that any pass can be replayed in the ground system without the simulator running: the ground system's native timestamped telemetry and command logs (HUG-GND-004) shall be recorded in a form the ground system can play back, and that playback shall be the demonstration evidence. The recorder-to-viewer replay package (`defs/replay_schema.yaml`, HUG-UI-002/003) is a separate interface and does not discharge this requirement.
  - id: HUG-EPS
    name: 'Power model'
    requirements:
      - id: HUG-EPS-001
        verification: ['T']
        trace: 'NEED-02; HUG-SYS-001'
        text: |-
          Battery state of charge shall evolve per the energy balance of array generation minus load consumption, applying charge efficiency 0.95 and discharge efficiency 0.95.
      - id: HUG-EPS-002
        verification: ['T']
        trace: 'NEED-02; HUG-SYS-002'
        text: |-
          Solar-array generation shall be zero in eclipse and shall ramp across eclipse transitions over no more than 10 s.
      - id: HUG-EPS-003
        verification: ['T']
        trace: 'NEED-03; CON-02; FMEA REC-01'
        text: |-
          The EPS shall autonomously enter LOW_POWER mode when SoC falls below 30% and SAFE mode when SoC falls below 20%; each transition shall shed the payload load. Autonomous mode transitions shall be downward only; transition to a higher mode shall occur only by ground command (HUG-CMD-006).
      - id: HUG-EPS-004
        verification: ['T']
        trace: 'HUG-SYS-005; G001 F-03'
        text: |-
          The model shall support these injectable faults: (a) single array-string output forced to zero; (b) stuck-on load of 2.0 W; (c) housekeeping telemetry generation halt — from fault onset no housekeeping frames are generated or transmitted (observed effect: CDH_FRAME_CNT ceases advancing and no fresh values arrive), while spacecraft truth state continues to evolve; the fault latches until cleared by CMD_SYS_RESET, after which frame generation resumes with counters per HUG-CMD-005.
      - id: HUG-EPS-005
        verification: ['I']
        trace: 'NEED-04; Derive rule'
        text: |-
          EPS design envelope values (battery capacity 38 Wh, bus voltage 5.0 V, array peak generation 17 W, nominal bus load 4 W, payload load 3 W) shall be recorded in `defs/` and used consistently by model, dictionary limits, and FMEA.
  - id: HUG-GND
    name: 'Ground system'
    requirements:
      - id: HUG-GND-001
        verification: ['I']
        trace: 'NEED-04; Derive rule'
        text: |-
          The ground system (OpenC3 COSMOS) telemetry and command definitions shall be generated from `defs/tlm_cmd.yaml`; no hand-edited packet definitions.
      - id: HUG-GND-002
        verification: ['T']
        trace: 'NEED-02'
        text: |-
          The ground system shall apply yellow and red limits per the dictionary and shall annunciate violations visually and in the log.
      - id: HUG-GND-003
        verification: ['T']
        trace: 'NEED-02'
        text: |-
          The ground system shall send all five v0.1 commands and display command accept and reject counts from spacecraft telemetry.
      - id: HUG-GND-004
        verification: ['D']
        trace: 'NEED-04'
        text: |-
          All received telemetry and all sent commands shall be logged with timestamps and be exportable.
      - id: HUG-GND-005
        verification: ['T']
        trace: 'NEED-02; CON-01; CON-03'
        text: |-
          Telemetry shall be receivable and commands sendable only within computed contact windows of the single ground terminal.
      - id: HUG-GND-006
        verification: ['T']
        trace: 'NEED-02; G001-02 F-04'
        text: |-
          At pass setup the ground system shall display the version and digest of the loaded telemetry/command configuration, and the pre-pass step of PROC-001 shall verify them against the dictionary of record; a mismatch shall be a no-go for commanding until resolved.
  - id: HUG-CMD
    name: 'Commanding'
    requirements:
      - id: HUG-CMD-001
        verification: ['T']
        trace: 'NEED-03'
        text: |-
          The spacecraft shall validate every received command and reject on: unknown opcode, out-of-range argument, or mode inhibit; each rejection shall increment the reject counter and set a reject-reason code in telemetry.
      - id: HUG-CMD-002
        verification: ['T']
        trace: 'NEED-03; CON-04'
        text: |-
          Payload activation (state = ON) shall be inhibited when EPS mode is SAFE or SoC is below 40%.
      - id: HUG-CMD-003
        verification: ['T']
        trace: 'NEED-02'
        text: |-
          Payload sampling-rate commands shall accept only 0.1-10 Hz and shall be rejected when the payload is OFF.
      - id: HUG-CMD-004
        verification: ['T']
        trace: 'NEED-03'
        text: |-
          SAFE-mode entry commanded from the ground shall always be accepted regardless of mode.
      - id: HUG-CMD-005
        verification: ['T']
        trace: 'NEED-03; G001 F-04'
        text: |-
          System reset shall clear the stale-telemetry fault state, reinitialize command counters to zero and then apply its own acceptance increment — so the first post-reset housekeeping frame reads CDH_CMD_ACC_CNT = 1 and CDH_CMD_REJ_CNT = 0, which constitutes the reset acknowledgement — and preserve battery SoC.
      - id: HUG-CMD-006
        verification: ['T']
        trace: 'NEED-03; CON-02; FMEA REC-01'
        text: |-
          The mode-set command shall command EPS mode to NOMINAL or LOW_POWER only; it shall be rejected (ARG_RANGE) for any other target, and rejected (MODE_INHIBIT) when EPS_BATT_SOC is below 35% for target NOMINAL or below 25% for target LOW_POWER. A commanded transition to LOW_POWER shall shed the payload load; a transition to NOMINAL shall not re-enable the payload.
      - id: HUG-CMD-007
        verification: ['T']
        trace: 'NEED-03; G001 F-05'
        text: |-
          Command accounting shall be exactly-once: each received command shall increment exactly one of CDH_CMD_ACC_CNT or CDH_CMD_REJ_CNT by exactly one, and the increment plus any commanded telemetry effect shall be visible no later than the next housekeeping frame (≤ 1 s at the nominal rate). CMD_SYS_RESET is the sole exception to simple delta arithmetic; its acknowledgement is the post-reset counter epoch per HUG-CMD-005. Absence of any counter delta within 10 s of a verified send is the loss-of-commandability declaration threshold used by PROC-003's command-path branch.
  - id: HUG-OPS
    name: 'Operations'
    requirements:
      - id: HUG-OPS-001
        verification: ['I']
        trace: 'NEED-02; FMEA REC-02; G001-07 F-01'
        text: |-
          Written procedures shall exist for: nominal activation pass (PROC-001), low-battery response (PROC-002), loss-of-telemetry-or-command response (PROC-003). Each procedure step shall carry a stable step identifier (PROC-NNN-Snn); each step shall name the role executing it and the telemetry it checks; and each decision step shall name the observation that selects each of its branches.
      - id: HUG-OPS-002
        verification: ['I']
        trace: 'NEED-04; G001-06 F-01; G001-07 F-01; G001-07 F-02; G001-08 F-01; G001-09 F-01; G001-10 F-01'
        text: |-
          Every executed pass shall produce a pass report containing: pass plan, event timeline, limit violations, actions with procedure step references, a per-step completion record, and disposition of anomalies. The per-step completion record shall contain exactly one entry for every step of the governing procedure, keyed by the step's stable identifier (HUG-OPS-001), carrying: a completion state from the bounded set {completed, not applicable, omitted}; for a not-applicable entry, the stated basis — the condition or branch outcome that made the step inapplicable; for a completed decision step, the recorded observation or decision outcome that selected the branch taken; for an omitted decision step, the record that no observation was made and no branch was selected; and for an omitted entry, a reference to its anomaly disposition. Post-pass review shall compare the completion record against the governing procedure; an applicable step without a completed or omitted entry, or a step without any entry, is an omission finding. An omission finding shall be recorded and dispositioned as an anomaly in the pass report's disposition-of-anomalies content, retained truthfully as an omitted entry, with corrective action defined: re-execution of the missed step at the next opportunity where feasible — recorded as a completed entry for the re-executed step and referenced from the omitted entry — or an explicit owner risk acceptance — a documented acceptance with rationale approved by the design authority (the owner), recorded in the pass report and referenced from the omitted entry. The omitted state is truthful and permanent for the pass in which the step was missed.
      - id: HUG-OPS-003
        verification: ['D']
        trace: 'NEED-04; ASM-02'
        text: |-
          The v0.1 campaign shall comprise at least one nominal pass and three anomaly passes (one per fault class), executed human-in-the-loop on the operator's scheduled availability.
      - id: HUG-OPS-004
        verification: ['I']
        trace: 'NEED-04'
        text: |-
          Each anomaly pass shall additionally produce an anomaly report with cause, response evaluation, and any resulting change requests to procedures or requirements.
  - id: HUG-UI
    name: 'Mission viewer (VÉ)'
    requirements:
      - id: HUG-UI-001
        verification: ['I']
        trace: 'Brief §5.1; NEED-04'
        text: |-
          The mission viewer shall be display-only: no code path shall exist from the viewer to the simulator, the ground system, or any command interface.
      - id: HUG-UI-002
        verification: ['T', 'D']
        trace: 'NEED-04; Brief §5.1'
        text: |-
          The viewer shall render exclusively from recorded replay packages conforming to `defs/replay_schema.yaml`, and shall operate with neither the simulator nor the ground system running.
      - id: HUG-UI-003
        verification: ['I']
        trace: 'NEED-04; Derive rule'
        text: |-
          The replay package format shall be documented as a versioned interface definition (`defs/replay_schema.yaml`: fields, types, units, semantics); recorder and viewer shall both reference it, and neither shall embed an independent copy.
      - id: HUG-UI-004
        verification: ['D']
        trace: 'NEED-04'
        text: |-
          The viewer shall present, at minimum: orbit view with eclipse state and contact window, EPS power-flow animation, battery SoC and voltage trends with limit bands, annunciator states, command accept/reject events, and a pass timeline scrubber.
      - id: HUG-UI-005
        verification: ['I']
        trace: 'NEED-04; Derive rule'
        text: |-
          Limit values and alarm colorings displayed by the viewer shall derive from `defs/tlm_cmd.yaml` at build time; the viewer shall not define limits independently.
      - id: HUG-UI-007
        verification: ['T', 'I']
        trace: 'NEED-04; Brief §5.1; G001-02 F-15'
        text: |-
          The viewer shall render replay event text through a text-only sink with no markup or code interpretation; no replay-package content shall be interpreted as executable or markup content. Verification shall include a malicious-markup package test.
      - id: HUG-UI-006
        verification: ['D']
        trace: 'NEED-04; Brief §5.1'
        text: |-
          The viewer shall run as a static web application from local files or static hosting, with no backend services.
  - id: HUG-VER
    name: 'Verification discipline'
    requirements:
      - id: HUG-VER-001
        verification: ['T', 'I']
        trace: 'NEED-04; Method rule; G001 F-08; G001-02 F-03; G001-03 F-02/F-07'
        text: |-
          The traceability matrix shall be generated by tool with the requirements source (`defs/requirements.yaml`) as its spine: every requirement shall produce a matrix row; every requirement shall reach at least one NEED, either by direct citation or through an explicitly traversable, acyclic chain of parent requirements; a requirement with no such upstream path, or with no downstream verification reference (checker, procedure, or campaign artifact), shall fail matrix generation; and every NEED, CON, and ASM identifier defined in the CONOPS shall be cited by at least one requirement or generation shall fail. A hand-maintained matrix shall not be accepted as evidence. Each specified failure condition shall be demonstrated to fail generation (negative case) before a passing matrix is accepted.
      - id: HUG-VER-002
        verification: ['T']
        trace: 'NEED-04; Method rule'
        text: |-
          Every requirement verified by Test shall have a checker demonstrated to fail under a violated condition before its passing result is accepted.
      - id: HUG-VER-003
        verification: ['T']
        trace: 'NEED-04'
        text: |-
          The verification report shall be generated by executing all checkers against the release candidate and shall record pass/fail per requirement with run metadata.

