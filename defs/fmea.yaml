# ---------------------------------------------------------------- Sec. 1
purpose:
  intro: |-
    This document analyzes the credible functional failure modes of the HUGINN spacecraft and its ground segment for the v0.1 operations slice, ranks them by criticality, and records for each the detection path, compensating provisions, and disposition. It serves three purposes in the design record:
  items:
    - |-
      It justifies the v0.1 injectable fault set (HUG-EPS-004) as a *selection* from the credible failure space rather than the whole of it (§6).
    - |-
      It verifies that every telemetry limit and procedure in the ratified dictionary and requirements has a failure mode it exists to catch, and that no high-criticality failure mode lacks a detection path.
    - |-
      It feeds the change recommendations in §7 into the requirements and dictionary before the HUG-G001 freeze, while defects are cheap.
  in_scenario: |-
    The analysis is written in-scenario, like the CONOPS: HUGINN is a fictional 6U spacecraft operated through a simulated mission campaign; the analyzed "hardware" is the behavior specified in the requirements and modeled in the simulator. This FMEA covers the mission system as designed for v0.1 — it is not an FMEA of the Python implementation or the development process.
  analysis_level: |-
    **Analysis level:** functional (subsystem functions, not piece-parts). **Items analyzed:** EPS (solar-array generation, energy storage, bus regulation, load switching, autonomous mode control), C&DH (telemetry generation, command handling, timekeeping), and the ground segment (GS-RAVENSROOST contact, telemetry/command transport, ground monitoring and display, operations). Subsystems excluded from v0.1 by concept brief §3 (thermal, ADCS, link-budget physics, payload sensor) appear only where a failure mode logically lands in them, dispositioned EXCLUDED for completeness.

# ---------------------------------------------------------------- Sec. 2
ground_rules:
  - id: GR-01
    rule: |-
      Single-failure analysis: one failure mode at a time, from a nominal initial state during routine operations (sunlit/eclipse cycle per the surrogate reference orbit, one ground contact per pass at GS-RAVENSROOST).
  - id: GR-02
    rule: |-
      Design envelope values are those ratified under HUG-EPS-005: 38 Wh battery (2S Li-ion), 5.0 V regulated bus, 17 W peak array in two 8.5 W strings, 4 W nominal bus load, 3 W payload load, charge/discharge efficiency 0.95. Limits are those ratified at TLM/CMD Dictionary v0.2 and unchanged through the current dictionary; any limit change reopens this analysis.
  - id: GR-03
    rule: |-
      Autonomous protective functions (mode ladder per HUG-EPS-003, command validation per HUG-CMD-001/002) are part of the analyzed baseline and are assumed to operate — except in the rows that analyze their own failure (FM-EPS-10, FM-CDH-03).
  - id: GR-04
    rule: |-
      Severity is the worst credible end effect assuming **no ground intervention**. Ground detection and operator response are recorded as compensating provisions, not folded into severity.
  - id: GR-05
    rule: |-
      Likelihood levels are assigned qualitatively from published small-satellite failure experience (EPS and software faults dominate early CubeSat failures; single-string and latch-up events are documented occurrences). Within the exercise they rank risk; they do not predict hardware behavior.
  - id: GR-06
    rule: |-
      Detection paths use only the ratified 16-point telemetry set and ground-derived monitors. A failure mode detectable only with excluded telemetry (e.g., battery temperature) is marked accordingly.

# ---------------------------------------------------------------- Sec. 3
severity_lead: |-
  **Severity (mission-level end effect, per GR-04):**
severity_definitions:
  - cat: 'I'
    name: 'Catastrophic'
    definition: |-
      Loss of spacecraft or permanent loss of mission capability (e.g., battery destruction, unrecoverable loss of bus power or C&DH).
  - cat: 'II'
    name: 'Critical'
    definition: |-
      Major mission degradation: extended loss of payload operations, loss of ground insight or commandability beyond one pass, latent defeat of a protective layer, or permanent capability reduction short of mission loss.
  - cat: 'III'
    name: 'Marginal'
    definition: |-
      Temporary, recoverable degradation: loss or curtailment of a single pass or of science collection, recoverable by procedure or autonomous protection.
  - cat: 'IV'
    name: 'Negligible'
    definition: |-
      Nuisance effect; no mission impact beyond minor inefficiency or operator workload.

likelihood_lead: |-
  **Likelihood (qualitative, per GR-05):**
likelihood_definitions:
  - level: 'A'
    name: 'Frequent'
    definition: |-
      Expected to occur repeatedly during the mission.
  - level: 'B'
    name: 'Probable'
    definition: |-
      Expected to occur at least once during the mission.
  - level: 'C'
    name: 'Occasional'
    definition: |-
      May occur during the mission; has occurred on comparable missions.
  - level: 'D'
    name: 'Remote'
    definition: |-
      Unlikely but credible.
  - level: 'E'
    name: 'Improbable'
    definition: |-
      So unlikely it is assumed not to occur; consequences still analyzed.

criticality_matrix_lead: |-
  **Criticality matrix (risk class):**
criticality_matrix_corner: 'Sev \ Lik'
criticality_matrix_levels: ['A', 'B', 'C', 'D', 'E']
# Risk class by severity (row) and likelihood (column). The ONE place risk class
# is defined; every Risk cell in the document is looked up here at render time.
criticality_matrix:
  'I': {'A': R1, 'B': R1, 'C': R1, 'D': R2, 'E': R2}
  'II': {'A': R1, 'B': R1, 'C': R2, 'D': R2, 'E': R3}
  'III': {'A': R2, 'B': R2, 'C': R2, 'D': R3, 'E': R3}
  'IV': {'A': R3, 'B': R3, 'C': R3, 'D': R3, 'E': R3}

risk_class_note: |-
  R1 (high): unacceptable as-is — requires a design change or an explicit owner waiver. R2 (medium): acceptable only with a verified detection path plus a defined response, or an explicit owner risk acceptance. R3 (low): acceptable as-is.
disposition_vocabulary: |-
  **Disposition vocabulary:** EXERCISED = injected in the v0.1 campaign and procedure-covered; MITIGATED = design and/or process provision in place and **verified** — earnable only with HUG-G002 evidence, so no row carries it at this pre-build gate; **COMMITTED** = design provision required by a cited requirement or definition of record, whose existence and verification fall due at build and are demonstrated at HUG-G002 (added per F-09); DETECTED = detection and operator response defined but not exercised in the v0.1 campaign; ACCEPTED = risk accepted for v0.1 with rationale (owner ratification required, §8); EXCLUDED = belongs to modeling excluded from v0.1 by concept brief §3.

# ---------------------------------------------------------------- Sec. 4-5
# Worksheet blocks in document order. `risk` is absent by design (see header).
worksheet_columns: ['ID', 'Function', 'Failure mode (cause)', 'End effect (per GR-04)', 'S', 'L', 'Risk', 'Detection', 'Compensating provisions', 'Disposition']
worksheets:
  - heading: '4. Worksheets — spacecraft'
    level: 2
    rows: null            # section heading only; its worksheets follow
  - heading: '4.1 EPS'
    level: 3
    preamble: |-
      The mode ladder and limit set are deliberately layered: the ground sees EPS_BATT_SOC yellow at 35% before autonomy acts at 30% (LOW_POWER) and 20% (SAFE, coinciding with SoC red). An operator therefore gets one decision window ahead of each autonomous action.
    rows:
      - id: FM-EPS-01
        severity: 'III'
        likelihood: 'C'
        disposition_class: EXERCISED
        function: 'Array generation'
        failure_mode: |-
          Single string output loss (string open, blocking-diode or interconnect failure)
        end_effect: |-
          Generation halved (17→8.5 W peak); energy-negative with payload on; autonomy sheds payload at 30% SoC; science lost until ground action
        detection: |-
          EPS_SA1_I/EPS_SA2_I asymmetry; SoC decline crossing YL 35 (dictionary ledger: string failure crosses SoC yellow); EPS_BATT_I discharge trend
        provisions: |-
          Mode ladder (HUG-EPS-003); PROC-002 low-battery response
        disposition: |-
          EXERCISED — fault (a) of HUG-EPS-004; campaign pass P2
      - id: FM-EPS-02
        severity: 'I'
        likelihood: 'E'
        disposition_class: ACCEPTED
        function: 'Array generation'
        failure_mode: |-
          Total array output loss (common-cause: deployment/harness failure)
        end_effect: |-
          No generation; battery depletes over a few orbits even in SAFE; loss of spacecraft
        detection: |-
          Both SA currents zero while ADM_ECLIPSE = SUNLIT
        provisions: |-
          SAFE mode extends survival time for diagnosis; no recovery without generation
        disposition: |-
          ACCEPTED — full common-cause generation loss (deployment/harness) is rated improbable (E) on 6U deployment heritage, and no credible v0.1 response exists regardless of cause. String redundancy is not the acceptance basis: it does not address a common-cause mode (rationale rewritten per F-10; owner re-ratification §8 item 6)
      - id: FM-EPS-03
        severity: 'III'
        likelihood: 'B'
        disposition_class: ACCEPTED
        function: 'Array generation'
        failure_mode: |-
          Gradual output degradation (radiation/thermal cycling)
        end_effect: |-
          Slowly shrinking power margin; earlier LOW_POWER entries late in mission
        detection: |-
          SA current trend vs. beginning-of-life baseline across passes
        provisions: |-
          Ops planning: reduced payload duty cycle
        disposition: |-
          ACCEPTED for v0.1 (single-pass campaign cannot exercise a slow trend); trending is a v0.2 candidate (§7 REC-03)
      - id: FM-EPS-04
        severity: 'I'
        likelihood: 'E'
        disposition_class: ACCEPTED
        function: 'Energy storage'
        failure_mode: |-
          Battery cell open-circuit failure
        end_effect: |-
          Loss of energy storage; spacecraft dies at first eclipse entry
        detection: |-
          EPS_BATT_V collapse / erratic under load (RL 6.8 V)
        provisions: |-
          None onboard; single battery is a v0.1 architecture decision
        disposition: |-
          ACCEPTED — single-string battery, consistent with 6U class practice
      - id: FM-EPS-05
        severity: 'II'
        likelihood: 'C'
        disposition_class: ACCEPTED
        function: 'Energy storage'
        failure_mode: |-
          Capacity fade / cell degradation (cycling, age)
        end_effect: |-
          Effective capacity below 38 Wh; deeper depth-of-discharge each orbit; shrinking eclipse margin
        detection: |-
          Ground-observed drift in SoC-vs-voltage correlation; earlier YL 35 crossings than the pass plan predicts
        provisions: |-
          Ops planning: DoD management via payload duty cycle
        disposition: |-
          ACCEPTED for v0.1; v0.2 fault-campaign candidate (§7 REC-03)
      - id: FM-EPS-06
        severity: 'II'
        likelihood: 'E'
        disposition_class: COMMITTED
        function: 'Energy storage'
        failure_mode: |-
          Charge control failure at full charge (overcharge)
        end_effect: |-
          Cell overstress; possible permanent damage
        detection: |-
          EPS_BATT_V YH 8.3 / RH 8.5
        provisions: |-
          Model behavior: charge tapers at full (dictionary note 2); the EPS_BATT_V voltage-high alarm (YH 8.3 / RH 8.5) exists and receives the generic contingency response (CONOPS Sec. 4.4) — no dedicated battery-voltage-high procedure step in v0.1 (owner disposition, Sec. 8 item 5)
        disposition: |-
          COMMITTED — charge-taper behavior is a definition of record (dictionary note 2), verification due at HUG-G002; absence of a battery-voltage-high procedure step accepted for v0.1 (owner disposition, §8 item 5; CONOPS §4.4 carries the generic-response mapping)
      - id: FM-EPS-07
        severity: 'I'
        likelihood: 'E'
        disposition_class: ACCEPTED
        function: 'Bus regulation'
        failure_mode: |-
          Regulated bus out of tolerance or lost (regulator failure)
        end_effect: |-
          Brownout/damage of all loads including C&DH; loss of spacecraft
        detection: |-
          EPS_BUS_V outside RL 4.75 / RH 5.25
        provisions: |-
          None onboard; single regulator is a v0.1 architecture decision
        disposition: |-
          ACCEPTED — single-point function, alarm coverage only
      - id: FM-EPS-08
        severity: 'III'
        likelihood: 'C'
        disposition_class: EXERCISED
        function: 'Load switching'
        failure_mode: |-
          Load stuck on, +2.0 W unexpected draw (switch FET short, radiation-induced latch-up)
        end_effect: |-
          Energy-negative trend persists even after payload shed (stuck load is unsheddable); SoC declines toward SAFE
        detection: |-
          EPS_LOAD_I crosses YH 1.5 A before RH 2.0 A (dictionary ledger item 1); plan-vs-actual SoC divergence
        provisions: |-
          PROC-002 load-shed branch; mode ladder backstop
        disposition: |-
          EXERCISED — fault (b) of HUG-EPS-004; campaign pass P3
      - id: FM-EPS-09
        severity: 'III'
        likelihood: 'D'
        disposition_class: DETECTED
        function: 'Load switching'
        failure_mode: |-
          Payload switch fails off / payload will not power
        end_effect: |-
          Loss of science collection; power posture unaffected
        detection: |-
          CMD_PLD_SET_STATE accepted (CDH_CMD_ACC_CNT increments) but PLD_STATE remains OFF
        provisions: |-
          PROC-001 command-verify step (counter delta + affected telemetry point)
        disposition: |-
          DETECTED by procedure
      - id: FM-EPS-10
        severity: 'II'
        likelihood: 'D'
        disposition_class: DETECTED
        function: 'Autonomous mode control'
        failure_mode: |-
          Mode ladder fails to actuate at 30%/20% SoC (logic fault, SoC estimation error)
        end_effect: |-
          Latent defeat of a protective layer: no immediate effect from this failure alone. (The compound outcome — deep discharge during a concurrent energy-negative condition — is recorded under the GR-01 exception note below this table, not rated here.)
        detection: |-
          Ground cross-check: EPS_BATT_SOC below 30 with EPS_MODE still NOMINAL; SoC YL 35 precedes the 30% actuation point by design
        provisions: |-
          CMD_SAFE_ENTER always accepted onboard (HUG-CMD-004) — ground can force SAFE. The HUG-VER-002 checker is development assurance that the ladder was built correctly; it is not a runtime mitigation.
        disposition: |-
          DETECTED — ground cross-check plus commanded backstop; ladder implementation COMMITTED (verification at HUG-G002)
      - id: FM-EPS-11
        severity: 'III'
        likelihood: 'D'
        disposition_class: DETECTED
        function: 'Autonomous mode control'
        failure_mode: |-
          Spurious LOW_POWER/SAFE entry (false trip)
        end_effect: |-
          Payload shed; science interrupted; spacecraft safe
        detection: |-
          EPS_MODE annunciation (SAFE annunciates per dictionary); SoC telemetry contradicts the transition
        provisions: |-
          Operator diagnosis; ground-commanded recovery via CMD_MODE_SET (hazardous-flagged, two-step confirmation; REC-01 resolution)
        disposition: |-
          DETECTED — commanded recovery path defined (REC-01 resolved)
    footnote: |-
      *GR-01 exception note (per G001 F-11; relocated below the completed worksheet per G001-02 F-13):* FM-EPS-10's worst compound outcome — an unactuated ladder concurrent with an energy-negative fault, permitting deep discharge (severity I) — requires two simultaneous failures and is therefore outside the single-failure frame. It is recorded here explicitly rather than silently folded into the row's rating; the compensating path for the compound case is the same ground cross-check and commanded SAFE entry, exercised every pass by the state-of-health assessment.
  - heading: '4.2 C&DH'
    level: 3
    rows:
      - id: FM-CDH-01
        severity: 'II'
        likelihood: 'C'
        disposition_class: EXERCISED
        function: 'Telemetry generation'
        failure_mode: |-
          Housekeeping telemetry generation halts — no frames generated or transmitted (software hang, task crash); observed as CDH_FRAME_CNT ceasing to advance
        end_effect: |-
          Ground loses insight; spacecraft state unknown; commanding integrity uncertain; autonomous protections continue onboard
        detection: |-
          Ground-derived staleness monitor on CDH_FRAME_CNT: no advance 10 s → YL, 30 s → RL (dictionary note 1 — a halted counter cannot alarm itself)
        provisions: |-
          PROC-003 loss-of-telemetry-or-command response, escalating to CMD_SYS_RESET (hazardous, two-step confirm); reset preserves SoC per HUG-CMD-005
        disposition: |-
          EXERCISED — fault (c) of HUG-EPS-004; campaign pass P4
      - id: FM-CDH-02
        severity: 'I'
        likelihood: 'D'
        disposition_class: ACCEPTED
        function: 'C&DH processing'
        failure_mode: |-
          Total C&DH failure — no telemetry, no command response (processor failure)
        end_effect: |-
          Loss of insight and commandability; loss of mission
        detection: |-
          No frame lock at AOS on an otherwise nominal pass
        provisions: |-
          None — no redundant processor in the v0.1 architecture
        disposition: |-
          ACCEPTED — consistent with 6U class single-string avionics
      - id: FM-CDH-03
        severity: 'II'
        likelihood: 'D'
        disposition_class: DETECTED
        function: 'Command handling'
        failure_mode: |-
          Command validation faulty — valid commands rejected or ignored (logic fault)
        end_effect: |-
          Loss of effective commandability; autonomy still protects power posture
        detection: |-
          CDH_CMD_REJ_CNT delta with CDH_REJ_REASON on a known-good command; CDH_CMD_ACC_CNT not incrementing
        provisions: |-
          Retry per procedure command-verify step; escalation per PROC-003, whose scope covers loss of commandability (REC-02 resolution)
        disposition: |-
          DETECTED by design (command accounting); PROC-003 owns the response (REC-02 resolved)
      - id: FM-CDH-04
        severity: 'II'
        likelihood: 'E'
        disposition_class: COMMITTED
        function: 'Command handling'
        failure_mode: |-
          Command executes incorrectly or unintended execution (corruption)
        end_effect: |-
          Wrong spacecraft configuration; worst credible case is an unintended hazardous action
        detection: |-
          Command accounting: effect verified by counter delta plus the affected telemetry point after every command
        provisions: |-
          Hazardous commands (CMD_SAFE_ENTER, CMD_SYS_RESET, CMD_MODE_SET) require two-step ground confirmation; onboard inhibits reject unsafe payload activation (HUG-CMD-002) and unsafe mode transitions (HUG-CMD-006)
        disposition: |-
          COMMITTED — the command-safety pattern is required by HUG-CMD-001/002/006 and the dictionary; built and verified at HUG-G002 (F-09)
      - id: FM-CDH-05
        severity: 'III'
        likelihood: 'E'
        disposition_class: ACCEPTED
        function: 'Timekeeping'
        failure_mode: |-
          MET fault — CDH_MET stalls or jumps
        end_effect: |-
          Telemetry timeline corrupted; pass reconstruction and replay-package integrity degraded; no direct spacecraft hazard
        detection: |-
          CDH_MET vs. ground receive-time divergence across the pass
        provisions: |-
          Ground timestamps all telemetry independently (HUG-GND-004); replay package times are pass-relative on the ground recorder's monotonic clock anchored by `meta.epoch_utc` (schema v0.3 §2), so a stalled or jumping CDH_MET corrupts telemetry content only, never the package timeline (G001 F-06; G001-02 F-02)
        disposition: |-
          ACCEPTED — ground timestamping bounds the effect
  - heading: '5. Worksheets — ground segment'
    level: 2
    rows:
      - id: FM-GND-01
        severity: 'III'
        likelihood: 'B'
        disposition_class: ACCEPTED
        function: 'Contact (GS-RAVENSROOST)'
        failure_mode: |-
          Station outage — pass missed entirely (equipment failure, weather, scheduling)
        end_effect: |-
          One or more passes lost; no insight or commanding until next contact; onboard autonomy carries the spacecraft
        detection: |-
          Pass plan vs. contact log; absence of AOS
        provisions: |-
          Single-station architecture is a ratified v0.1 decision; autonomous mode ladder rides through unattended orbits
        disposition: |-
          ACCEPTED for v0.1; missed-pass drill is a v0.2 candidate (§7 REC-03)
      - id: FM-GND-02
        severity: 'III'
        likelihood: 'C'
        disposition_class: EXCLUDED
        function: 'Telemetry transport'
        failure_mode: |-
          Downlink degraded — corrupted or dropped frames within a pass (link margin, interference)
        end_effect: |-
          Partial pass data; gaps in trend assessment
        detection: |-
          Frame-count gaps vs. CDH_FRAME_CNT; framing errors at ingest
        provisions: |-
          Contact model is elevation-mask visibility only — link physics is out of v0.1 scope (brief §3)
        disposition: |-
          EXCLUDED — listed for completeness; behavior not modeled in v0.1
      - id: FM-GND-03
        severity: 'III'
        likelihood: 'C'
        disposition_class: DETECTED
        function: 'Command transport'
        failure_mode: |-
          Uplink failure — command sent but not received
        end_effect: |-
          Commanded action does not occur; pass objectives slip
        detection: |-
          Command accounting: no CDH_CMD_ACC_CNT / REJ_CNT delta after send
        provisions: |-
          Retry within the contact window per the procedure command-verify step
        disposition: |-
          DETECTED by design (command accounting)
      - id: FM-GND-04
        severity: 'II'
        likelihood: 'C'
        disposition_class: COMMITTED
        function: 'Ground monitoring'
        failure_mode: |-
          Limit/display misconfiguration — wrong, stale, or hand-edited definitions loaded (config drift, stale generated file)
        end_effect: |-
          Latent: alarms missed or false; defeats the detection layer most other rows depend on
        detection: |-
          Loaded-configuration version/digest displayed at pass setup and verified against the dictionary of record per PROC-001's pre-pass step (HUG-GND-006); discrepancy between annunciated limits and the dictionary of record (HUG-GND-002)
        provisions: |-
          OpenC3 definitions generated from `defs/tlm_cmd.yaml`, never hand-edited (HUG-GND-001); configuration mismatch = no-go for commanding (HUG-GND-006); every checker negative-tested (HUG-VER-002)
        disposition: |-
          COMMITTED — detection and response required by HUG-GND-001/-002/-006; built and verified at HUG-G002 (G001 F-09; G001-02 F-04)
      - id: FM-GND-05
        severity: 'II'
        likelihood: 'C'
        disposition_class: COMMITTED
        function: 'Operations'
        failure_mode: |-
          Operator error — wrong command, wrong argument, or procedure step skipped
        end_effect: |-
          Wrong spacecraft configuration; worst credible case is an unintended hazardous command
        detection: |-
          Per-case (G001-05 F-02): wrong or invalid command/argument — command accounting in-contact (rejection with reason, or an accepted command whose effect fails the step's named telemetry check); wrong-but-valid command — the verify step's effect-vs-procedure check in-contact; skipped procedure step — no in-pass telemetry signature; detected post-pass by comparing the pass report's per-step completion record against the governing procedure — one entry per step, keyed by stable step identifier, with bounded completion state, applicability basis, and state-conditional decision evidence — the branch-selecting observation for a completed decision step, or the record that none occurred for an omitted one (HUG-OPS-002 per G001-06 F-01 / G001-07 F-01 / G001-10 F-01) — so an omission surfaces as an applicable step without a completed entry and is retained truthfully as an omitted entry referencing its anomaly disposition (G001-09 F-01)
        provisions: |-
          Two-step confirmation on hazardous commands; onboard validation rejects out-of-range/inhibited commands (HUG-CMD-001/002); every procedure step names its role and the telemetry it checks (HUG-OPS-001); a step-omission finding is dispositioned as an anomaly in the pass report with defined corrective action — re-execution at the next opportunity where feasible, or an explicit owner risk acceptance approved by the design authority (HUG-OPS-002, Director-ruled Option A per G001-07 F-02, owner-bound per G001-08 F-01)
        disposition: |-
          COMMITTED — the layered command-safety provisions are required by HUG-CMD-001/002 and HUG-OPS-001, and the per-step completion record with omission-anomaly disposition and corrective action by HUG-OPS-002 (G001-06 F-01; G001-07 F-01/F-02); built and verified at HUG-G002 (F-09)
      - id: FM-GND-06
        severity: 'III'
        likelihood: 'D'
        disposition_class: DETECTED
        function: 'Logging / recording'
        failure_mode: |-
          Telemetry or command logging failure — pass record lost or incomplete
        end_effect: |-
          Both recording paths for the pass degraded — the ground system's native log record and the recorder-to-viewer replay package; no spacecraft hazard
        detection: |-
          Two separate post-pass checks in the pass report, one per recording path (G001-16 F-01): the native ground-system telemetry and command logs verified complete and played back in the ground system (HUG-GND-004; the playback is the HUG-SYS-006 evidence), and the replay package exported and checked for schema conformance on the recorder-to-viewer path (HUG-UI-002/003)
        provisions: |-
          Each path carries its own response and evidence, and neither substitutes for the other: a native-log failure is worked as a ground-record anomaly against HUG-GND-004/HUG-SYS-006; a package failure is worked against the schema conformance contract, with renderability without live systems the HUG-UI-002 check
        disposition: |-
          DETECTED by procedure

# ---------------------------------------------------------------- Sec. 6
fault_set:
  intro: |-
    The v0.1 injectable fault set (HUG-EPS-004) was selected, not assumed. The selection is one ordered rule, stated completely below; applying it to the §4–§5 worksheets reproduces the selected set exactly, with no unstated step (restated per G001-04 F-02).
  step_1: |-
    **Step 1 — candidate pool.** Every worksheet row rated R2 at baseline. R2 is the highest criticality class present (no credible mode ranks R1 — roll-up below), and R3 rows are below the injection threshold by rule: campaign resources go to the highest class present. Pool: 16 rows.
  step_2: |-
    **Step 2 — eligibility screen.** Criteria (a)–(e) are applied to each pool row in order; a row leaves the pool at the first criterion it fails, and §6.2 records that criterion as its exclusion of record.
  criteria:
    - letter: 'a'
      name: 'Single-pass observability.'
      text: |-
        From GR-01's nominal initial state, the fault's injection and its detection fit within one contact window as a single failure. Modes observable only across multiple passes (trends, drills), only under a compound precondition (the GR-01 exception row), or whose stated detection arrives only in post-pass review rather than within the contact, fail.
    - letter: 'b'
      name: 'Detectability.'
      text: |-
        Detectable with the ratified 16-point telemetry set and ground-derived monitors (GR-06).
    - letter: 'c'
      name: 'Procedurable in-pass response.'
      text: |-
        A credible written-procedure response exists and completes within the same contact window. Modes with no credible v0.1 response — the accepted architecture risks — fail.
    - letter: 'd'
      name: 'No excluded model.'
      text: |-
        Exercising the mode requires no thermal, ADCS, or link-physics model (brief §3).
    - letter: 'e'
      name: 'Routine-exercise exclusion (ratified: G001-03 F-06 disposition).'
      text: |-
        The mode's operator response must require diagnosis and decision beyond the routine command-verify step already exercised on every pass; a mode whose full detection-and-response path is demonstrated continuously by nominal operations adds no unexercised evidence when injected. Per the ratified FM-GND-03 application, a detection that is itself a routine per-pass step, with a response that repeats or escalates that same step per its written branch, is within this exclusion.
  step_3: |-
    **Step 3 — cardinality and ranking.** The v0.1 campaign provides exactly three fault-injection passes (P2, P3, P4; CONOPS §5), so the injectable set is capped at three rows. If the screen left more than three, the top three would be taken by likelihood (A highest), then severity (I highest), then worksheet order. In v0.1 the screen leaves exactly three rows, so the ranking is not invoked and the cap is met exactly.
  selected_columns: ['Injected fault', 'FMEA row', 'Risk', 'Campaign pass', 'Procedure']
  selected:
    - row: FM-EPS-01
      fault: '(a) Array string output zero'
      campaign_pass: 'P2'
      procedure: 'PROC-002'
    - row: FM-EPS-08
      fault: '(b) Stuck-on load, 2.0 W'
      campaign_pass: 'P3'
      procedure: 'PROC-002 (load-shed branch)'
    - row: FM-CDH-01
      fault: '(c) Housekeeping telemetry generation halt'
      campaign_pass: 'P4'
      procedure: 'PROC-003'
  selected_note: |-
    All three survivors carry likelihood C — the highest likelihood among rows passing the screen — which is the sense in which earlier revisions read "highest-likelihood"; likelihood is not itself a screen criterion.
  exclusion_columns: ['FMEA row', 'Risk', 'First failed criterion', 'Basis']
  exclusions:
    - row: FM-EPS-02
      criterion: '(c)'
      basis: |-
        No credible v0.1 response regardless of cause (ACCEPTED architecture risk; §8 item 6).
    - row: FM-EPS-03
      criterion: '(a)'
      basis: |-
        Degradation trend, observable only across passes (v0.2 candidate, REC-03).
    - row: FM-EPS-04
      criterion: '(c)'
      basis: |-
        No onboard or procedural recovery from cell open-circuit (ACCEPTED).
    - row: FM-EPS-05
      criterion: '(a)'
      basis: |-
        Capacity-fade trend, observable only across passes (v0.2 candidate, REC-03).
    - row: FM-EPS-07
      criterion: '(c)'
      basis: |-
        No credible response to regulator loss (ACCEPTED).
    - row: FM-EPS-10
      criterion: '(a)'
      basis: |-
        Latent single failure: detectable only under a compound precondition (SoC decline concurrent with the ladder fault — the GR-01 exception row), not as a single failure in one pass.
    - row: FM-CDH-02
      criterion: '(c)'
      basis: |-
        No credible response to total C&DH loss (ACCEPTED).
    - row: FM-CDH-03
      criterion: '(e)'
      basis: |-
        Detection is the routine command-verify step's counter/reason reading; the response — retry per that step, escalation per PROC-003's command-path branch — repeats and escalates that same routine step (the ratified FM-GND-03 pattern).
    - row: FM-GND-01
      criterion: '(a)'
      basis: |-
        Missed-pass drill spans passes by definition (v0.2 candidate, REC-03).
    - row: FM-GND-02
      criterion: '(c)'
      basis: |-
        No written in-pass response exists in v0.1 — degraded-downlink partial-pass data is accepted as recorded, with no procedure branch to exercise; the excluded link-physics model (criterion (d)) is context, not the exclusion of record (per G001-05 F-01).
    - row: FM-GND-03
      criterion: '(e)'
      basis: |-
        Ratified exclusion of record (G001-03 F-06 disposition): detection (command accounting) and response (retry per the command-verify step, escalation per PROC-003's command branch) are exercised in every commanded sequence of every pass.
    - row: FM-GND-04
      criterion: '(e)'
      basis: |-
        Detection and response are PROC-001's routine pre-pass configuration-verification step (HUG-GND-006), exercised every pass; the mismatch response reloads and re-runs that same step under its no-go rule.
    - row: FM-GND-05
      criterion: '(a)'
      basis: |-
        Composite mode screened as a unit: the skipped-step case has no in-pass telemetry signature — its detection is the post-pass comparison of the report's per-step completion record against the governing procedure (HUG-OPS-002, per G001-06 F-01) — so the row's detection does not fit the contact window (per G001-05 F-02); the command-error cases alone would fall under (e) via the routine effect-vs-procedure verify step, noted as context.
  assurance_note: |-
    **Assurance-path note (context, not a criterion).** Four excluded rows — FM-EPS-10, FM-CDH-03, FM-GND-04, FM-GND-05 — are failures of, or are caught by, mechanisms whose correct construction is COMMITTED for verification at HUG-G002 (the HUG-VER-002 mode-ladder checker, command-validation negative tests, generated-configuration verification per HUG-GND-006). Earlier revisions cited that provision status as their exclusion reason; provision status is not a selection criterion, and the exclusions of record above rest entirely on the enumerated criteria. This note records the rows' assurance path only.
  rollup: |-
    **Roll-up.** No failure mode in the analyzed baseline ranks R1: the layered design (limit set → autonomy → command safety → procedure) holds every credible mode at R2 or below, which is the result the layering exists to produce.

# ---------------------------------------------------------------- Sec. 7
recommendations_intro: |-
  The analysis surfaced three items, all resolved by owner disposition 2026-07-25 (resolutions recorded inline and in §8):
recommendations:
  - id: REC-01
    finding: |-
      **REC-01 — SAFE-mode recovery is undefined (from FM-EPS-11; also affects post-P2/P3 recovery).** The v0.1 command set can enter SAFE (CMD_SAFE_ENTER) but nothing defines how the spacecraft leaves it: there is no mode-set command, HUG-EPS-003 specifies only downward transitions, and HUG-CMD-005 is silent on what CMD_SYS_RESET does to EPS_MODE. As drafted, a spacecraft in SAFE — spurious or legitimate — has no specified path back to NOMINAL, and PROC-002 cannot be closed out. Options for owner decision: (1) autonomous recovery to NOMINAL when SoC recovers above a hysteresis threshold (e.g., 40%, aligning with the payload-activation inhibit); (2) add a ground mode-set command (hazardous-flagged); (3) define CMD_SYS_RESET to re-evaluate mode from current SoC. Each option implies a requirements and dictionary revision.
    resolution: |-
      **Resolution (owner, 2026-07-25): option 2.** CMD_MODE_SET added as the fifth command — hazardous-flagged with two-step ground confirmation, targets NOMINAL or LOW_POWER only (SAFE entry remains CMD_SAFE_ENTER's function), rejected below SoC recovery floors (35% for NOMINAL, 25% for LOW_POWER — hysteresis above the 30%/20% autonomous entry points so a commanded exit cannot immediately re-trip). The design principle this establishes: autonomous transitions are downward only (toward safety); upward transitions occur only by deliberate ground command. Implemented as HUG-CMD-006 and an amended HUG-EPS-003 in Requirements v0.3, and the Commands table in Dictionary v0.3.
  - id: REC-02
    finding: |-
      **REC-02 — No procedure owns loss of commandability (from FM-CDH-03, FM-GND-03).** Detection exists (command accounting) but the response beyond in-pass retry is undocumented. Options: extend PROC-003's escalation pattern to cover command-path failure, or defer a dedicated procedure to v0.2 and record the gap as accepted.
    resolution: |-
      **Resolution (owner, 2026-07-25): extend PROC-003.** PROC-003 is broadened from "stale-telemetry response" to "loss-of-telemetry-or-command response": same detection-confirm-escalate pattern, with a command-path branch keyed on command accounting (no ACC/REJ counter delta after a verified send). HUG-OPS-001 amended accordingly in Requirements v0.3.
  - id: REC-03
    finding: |-
      **REC-03 — v0.2 fault-campaign candidates.** The accepted R2 rows that a multi-pass v0.2 campaign could exercise, in priority order: battery capacity fade (FM-EPS-05), missed-pass/station-outage drill (FM-GND-01), array degradation trending (FM-EPS-03).
    resolution: |-
      **Resolution (owner, 2026-07-25): ratified as nominated.**

