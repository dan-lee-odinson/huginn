# PASS-3 — STUCK-ON LOAD. Single contact, PROC-001 with PROC-002 invoked.
#
# CONTACT DESIGNATION, per D-016 ruling 1: a pass flies a contact's DURATION, taken from
# the computed week, at a mission position the pass plan chooses. This contact is 430 s,
# the duration of computed contact 9, flown at MET 800 to 1230. The pass plan
# (pass_plan.md, generated by tools/gen_pass_plan.py) is the same scenario with its fault
# removed, and is what every "against plan" value below is compared to.
#
# PROCEDURES VERSION 0.2. PROC-002-S02 was red-lined under D-017 before this pass: a load
# alarm goes to S03 without the energy-balance question. This pass is the first flown on it.

pass_id: 2026-10-11-P3
procedure: PROC-001
executed_utc: '2026-10-11T16:58:41Z'

pass_plan:
  window_aos_utc: '2026-10-11T17:05:04Z'
  window_los_utc: '2026-10-11T17:12:14Z'
  predicted_soc_pct: 65.813
  planned_commands: [CMD_PLD_SET_STATE OFF]

# NOTE on the window: the pass plan states the window in mission time, MET 800 to 1230.
# The UTC values are that window as flown. AOS is derived from the first frame received
# (CDH_MET 803 at 17:05:06.692Z) less three frames at the measured 1.0092 s mean frame
# interval; LOS is AOS plus the 430 s contact.
#
# NOTE on predicted_soc_pct: 65.813 is the pass plan's state of charge at MET 800, the
# acquisition. It is a prediction for this contact's own mission time.
#
# NOTE on planned_commands: the campaign plan records PASS-3 as commanded, with a
# load-shed response under PROC-002. The one planned command is that contingency shed,
# PROC-002-S04. The payload was already ON at acquisition by the scenario's own scripted
# command at MET 120, so the pass plan contains no payload activation.

event_timeline:
  - {utc: '2026-10-11T16:58:41Z', event: pre-pass configuration verification GO, dictionary v0.5 5e1c2750ef9e0d54}
  - {utc: '2026-10-11T17:05:04Z', event: AOS, simulator began transmitting from MET 800 after an 800-step silent pre-roll}
  - {utc: '2026-10-11T17:05:07Z', event: frame lock, first frame received CDH_MET 803, SoC 65.833 percent, frames for MET 800 to 802 not received}
  - {utc: '2026-10-11T17:06:45Z', event: EPS_LOAD_I stepped 1.400 to 1.800 A at CDH_MET 900 and crossed its 1.5 A YELLOW limit; EPS_BATT_I fell +1.304 to +1.043 A and stayed positive}
  - {utc: '2026-10-11T17:07:05Z', event: PROC-001-S07 limit response required, PROC-002 invoked}
  - {utc: '2026-10-11T17:07:44Z', event: CMD_PLD_SET_STATE state OFF sent, payload shed}
  - {utc: '2026-10-11T17:07:44Z', event: shed verified, CDH_CMD_ACC_CNT 1 to 2, PLD_STATE ON to OFF, EPS_LOAD_I 1.800 to 1.200 A, within one frame; EPS_LOAD_I back inside its limits}
  - {utc: '2026-10-11T17:10:16Z', event: final state snapshot, SoC 67.989 percent, EPS_MODE NOMINAL, EPS_LOAD_I 1.200 A, charging}
  - {utc: '2026-10-11T17:12:17Z', event: LOS, last frame received CDH_MET 1229, SoC 68.898 percent, spacecraft handed over charging with the stuck load still drawing}

limit_violations:
  - {point: EPS_LOAD_I, level: YELLOW, side: high, threshold_a: 1.5,
     first_utc: '2026-10-11T17:06:45Z', first_cdh_met: 900, value_at_first: 1.800,
     value_at_los: 1.200, cleared: true, cleared_utc: '2026-10-11T17:07:44Z',
     cleared_cdh_met: 959,
     note: 'yellow before red held: EPS_LOAD_I never exceeded 1.800 A against the 2.0 A red; cleared by the payload shed, 59 s after onset'}

actions:
  - {step: PROC-001-S02, action: 'ran tools/pass_setup.py --pass-id 2026-10-11-P3: GO on the first run, all four conditions PASS; recorded to pass_setup.md'}
  - {step: PROC-001-S07, action: 'limit response required branch taken on EPS_LOAD_I; PROC-002 invoked and recorded under invoked_procedures'}
  - {step: PROC-002-S04, action: 'CMD_PLD_SET_STATE state OFF sent at 17:07:43.660450Z; the ground command log records exactly one command for this contact'}
  - {step: PROC-002-S05, action: 'verified by counter delta AND affected points: ACC 1 to 2, REJ 0, PLD_STATE ON to OFF, EPS_LOAD_I 1.800 to 1.200 A, EPS_BATT_I +1.042 to +1.433 A, all in the frame at 17:07:44.128422Z, 468 ms after the send'}
  - {step: PROC-001-S16, action: 'telemetry extract taken over 16:55:00Z-17:15:00Z, 427 packets; command extract over the same window returned exactly 1 packet'}

completion_record:

  - step: PROC-001-S01
    role: PLAN
    operator: Dan Lee-Odinson
    state: completed
    records: {predicted_soc_pct: 65.813, window_aos_utc: '2026-10-11T17:05:04Z',
              window_los_utc: '2026-10-11T17:12:14Z'}

  - step: PROC-001-S02
    role: EPS
    operator: Dan Lee-Odinson
    state: completed
    records: {pass_setup_verdict: GO, identity_vs_dictionary_result: PASS,
              loaded_vs_repository_result: PASS, target_inventory_result: PASS}

  - step: PROC-001-S03
    role: FD
    operator: Dan Lee-Odinson
    state: completed
    branch: GO
    observation: >-
      tools/pass_setup.py printed Verdict GO with all four conditions PASS, dictionary
      v0.5, digest 5e1c2750ef9e0d54

  - step: PROC-001-S04
    role: EPS
    operator: Dan Lee-Odinson
    state: completed
    records: {first_frame_utc: '2026-10-11T17:05:07Z', cdh_frame_cnt_first: 804,
              cdh_frame_cnt_second: 805, staleness_annunciator_state: NOT_OBSERVED}
    note: >-
      first_frame_utc is the first frame RECEIVED (CDH_MET 803, CDH_FRAME_CNT 804, at
      17:05:06.692Z in telemetry_hk.csv). Frames for MET 800 to 802 were transmitted before
      the ground interface came up and never reached the ground, as on 2026-09-13-P1 and
      both PASS-2 contacts. The operator read CDH_FRAME_CNT twice and saw it advance; the
      two values recorded are the first two received frames, one second apart. The
      staleness annunciator was not looked at.

  - step: PROC-001-S05
    role: EPS
    operator: Dan Lee-Odinson
    state: completed
    branch: acquired
    observation: >-
      CDH_FRAME_CNT advanced by exactly one per housekeeping frame with no gap across the
      whole contact: 427 consecutive frames, CDH_FRAME_CNT 804 through 1230, CDH_MET 803
      through 1229, verified against telemetry_hk.csv. The operator watched it advance live
      at AOS. The staleness annunciator was not observed.

  - step: PROC-001-S06
    role: EPS
    operator: Dan Lee-Odinson
    state: completed
    records: {eps_batt_v_at_aos2: 7.6716, soc_pct_at_aos2: 66.617,
              soc_delta_vs_plan_pct: -0.029, eps_sa1_i_at_aos2: 1.70,
              eps_sa2_i_at_aos2: 1.70, adm_eclipse_at_aos2: SUNLIT}
    note: >-
      Values from the frame at CDH_MET 920, AOS plus 2 minutes. soc_delta_vs_plan_pct is
      against the pass plan's own value for MET 920, 66.646 percent, not against the
      acquisition value recorded at S01. The stuck load had been drawing for 20 s.

  - step: PROC-001-S07
    role: FD
    operator: Dan Lee-Odinson
    state: completed
    branch: limit response required
    observation: >-
      EPS_LOAD_I read 1.800 A, YELLOW, at or above its 1.5 A limit, having crossed it at
      CDH_MET 900, 20 s earlier. EPS_BATT_SOC 66.617 percent, well above 35 percent;
      EPS_MODE NOMINAL; EPS_BATT_I positive while SUNLIT. PROC-002 executed. This is the
      first pass of the campaign to take the limit-response branch on load current.

  - step: PROC-001-S08
    state: not_applicable
    basis: >-
      The pass plan contains no payload activation; the payload was already ON at
      acquisition by the scenario's scripted command at MET 120. PROC-002 closed with the
      spacecraft in a commanded stable configuration, payload OFF and charging, so the
      procedure returned here and found nothing to activate.
  - step: PROC-001-S09
    state: not_applicable
    basis: PROC-001-S08 not applicable; the pass plan contains no payload activation
  - step: PROC-001-S10
    state: not_applicable
    basis: PROC-001-S09 not applicable; no activation was planned or sent
  - step: PROC-001-S11
    state: not_applicable
    basis: PROC-001-S09 not applicable; there was no activation command to verify
  - step: PROC-001-S12
    state: not_applicable
    basis: PROC-001-S09 not applicable; there was no activation outcome to determine
  - step: PROC-001-S13
    state: not_applicable
    basis: PROC-001-S09 not applicable; no rate command was planned
  - step: PROC-001-S14
    state: not_applicable
    basis: PROC-001-S09 not applicable; there was no rate command to verify

  - step: PROC-001-S15
    role: EPS
    operator: Dan Lee-Odinson
    state: completed
    records: {soc_pct_at_los: 67.989, mode_at_los: NOMINAL, load_i_at_los: 1.200,
              batt_v_at_los: 7.6899, batt_i_at_los: 1.4305}
    note: >-
      Values from the frame at CDH_MET 1110, LOS minus 2 minutes. Against the pass plan's
      67.965 percent for MET 1110, +0.024: before the shed the spacecraft charged more
      slowly than plan, after it faster, because the plan keeps the payload on.

  - step: PROC-001-S16
    role: PLAN
    operator: Dan Lee-Odinson
    state: completed
    records: {observed_los_utc: '2026-10-11T17:12:17Z',
              computed_los_utc: '2026-10-11T17:12:14Z', last_cdh_frame_cnt: 1230}
    note: >-
      Observed LOS is the last frame received, CDH_MET 1229 at 17:12:16.612Z. It is 3 s
      after the computed LOS because frames arrived 1.0092 s apart on average, so the 430
      frames of the contact took about 434 s of wall clock.

  - step: PROC-001-S17
    role: PLAN
    operator: Dan Lee-Odinson
    state: completed

  - step: PROC-001-S18
    role: PLAN
    operator: Dan Lee-Odinson
    state: completed
    branch: complete
    observation: >-
      tools/pass_report.py --validate exits zero: exactly one entry per step of PROC-001
      and of the invoked PROC-002, every not-applicable entry carrying a basis, every
      completed decision step carrying its branch-selecting observation.

invoked_procedures:
  - procedure: PROC-002
    invoked_from: PROC-001-S07
    completion_record:

      - step: PROC-002-S01
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        records: {annunciated_point: EPS_LOAD_I, annunciated_value: 1.800,
                  annunciated_level: YELLOW, annunciated_utc: '2026-10-11T17:06:45Z',
                  annunciated_cdh_met: 900}

      - step: PROC-002-S02
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        branch: load alarm
        observation: >-
          The point confirmed at PROC-002-S01 is EPS_LOAD_I, 1.800 A against its 1.5 A
          yellow limit, which selects the branch. EPS_BATT_I read +1.043 A at the time with
          ADM_ECLIPSE SUNLIT: the spacecraft was still charging, more slowly than the pass
          plan's +1.304 A. Neither energy-balance outcome would have applied.

      - step: PROC-002-S03
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        branch: load excursion
        observation: >-
          EPS_SA1_I and EPS_SA2_I both read 1.70 A, symmetric and consistent with SUNLIT,
          while EPS_LOAD_I read 1.800 A, at or above 1.5 A. The load was 0.400 A above the
          pass plan's 1.400 A, which on the 5.0 V bus is the 2.0 W the step's text
          anticipates for a stuck load.

      - step: PROC-002-S04
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        records: {shed_command_utc: '2026-10-11T17:07:44Z',
                  shed_command_utc_precise: '2026-10-11T17:07:43.660450Z',
                  command: CMD_PLD_SET_STATE, argument_state: 'OFF',
                  cdh_met_at_send: 958}

      - step: PROC-002-S05
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        records: {pld_state_after_shed: 'OFF', load_i_after_shed: 1.200,
                  load_i_before_shed: 1.800, cdh_cmd_acc_cnt_before: 1,
                  cdh_cmd_acc_cnt_after: 2, cdh_cmd_rej_cnt: 0,
                  batt_i_before_shed: 1.0424, batt_i_after_shed: 1.4333,
                  effect_visible_utc: '2026-10-11T17:07:44.128422Z',
                  send_to_effect_ms: 468}
        note: >-
          EPS_LOAD_I fell by 0.600 A, exactly the payload's load, as the step expects. It
          fell to 1.200 A, not to the 0.800 A a payload-off spacecraft draws: the remaining
          0.400 A is the stuck load, which no ground command removes.

      - step: PROC-002-S06
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        branch: recovered
        observation: >-
          EPS_BATT_I read +1.433 A in the first frame after the verified shed and stayed
          between +1.428 and +1.433 A to LOS, SUNLIT throughout: non-negative across every
          one of the 271 frames after the shed. The step's text expects the stuck-load case
          to arrive here still negative; it did not, which OF-023 records.

      - step: PROC-002-S07
        state: not_applicable
        basis: >-
          PROC-002-S06 selected recovered. State of charge rose from 66.835 to 68.898
          percent after the shed with EPS_MODE NOMINAL throughout; there was no autonomous
          entry.
      - step: PROC-002-S08
        state: not_applicable
        basis: PROC-002-S06 selected recovered, not still negative

      - step: PROC-002-S09
        state: not_applicable
        basis: >-
          EPS_MODE read NOMINAL for all 427 frames of the contact. The step is applicable
          only when the spacecraft is in LOW_POWER or SAFE.
      - step: PROC-002-S10
        state: not_applicable
        basis: PROC-002-S09 not applicable; no mode command was sent, so there is no mode change to verify

      - step: PROC-002-S11
        role: FD
        operator: Dan Lee-Odinson
        state: completed
        note: >-
          The spacecraft anomaly is recorded in docs/anomalies/AR-002-stuck-load.md.

anomalies: []
