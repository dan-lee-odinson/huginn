# NOTE on predicted_soc_pct: as on contact A, 55 is the scenario's INITIAL state of
# charge and the only predicted value the build produces. No predicted profile exists for
# a contact at MET 21800, where the observed value is 35.49. The -19.5 delta at
# PROC-001-S06 is an artefact of comparing two different mission times, not a variance.
#
# NOTE on planned_commands: the campaign plan records PASS-2 as `Commanded: no` and
# justifies contact 16 on not needing commanding margin. PROC-002-S04 commands a payload
# shed whenever S03 selects array-string failure, which is what this pass is designed to
# produce. One command was therefore sent under the contingency procedure. The plan's
# field is wrong; the contact carried ample margin regardless (430 s leaves 190 s usable
# against the 20 s D-014 requires). Raised as a finding.

