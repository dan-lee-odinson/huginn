anomalies:
  - id: ANOM-002
    step: PROC-002-S07
    finding: >-
      PROC-002-S07 and PROC-002-S08 could not be completed within the contact. Both wait
      on an autonomous mode-ladder entry: S07 records the mode entered and the state of
      charge at entry, and S08 chooses between safing by command and letting the ladder
      hold. Measured, LOW_POWER entry lies at MET 22822 — 592 s after this contact's LOS
      at MET 22230. The operator watched for the remaining 223 s after the verified shed
      and EPS_MODE read NOMINAL for all 428 frames.
      S08's decision table additionally has no outcome for what was observed: safe by
      command requires state of charge at or below 20 percent (it was 33.709) or bus
      voltage outside 4.75 to 5.25 V (it was 5.0); ladder holds requires an autonomous
      entry to have occurred AND state of charge to have stopped falling, and neither
      did. Both branch criteria were unreachable inside a 430 s contact.
      This is the same shape as OF-017 and OF-018: a procedure step whose stated
      conditions its own scenario cannot produce in the window it is flown in. Recorded
      here as an omission because the steps produced no record, not because the operator
      failed to attempt them.
    feasibility: >-
      Re-execution is NOT feasible anywhere in the v0.1 campaign. Both steps wait on an
      autonomous mode-ladder entry, and no scenario in the campaign produces one.
      Measured on the committed model: as this pass was actually flown, with the payload
      shed verified at MET 22006, EPS_BATT_SOC bottoms out at 31.216 percent at the
      scenario's end and never reaches the 30 percent LOW_POWER threshold — the
      operator's correct response removed the very condition these steps exist to
      record. Had the shed not been sent, LOW_POWER entry would have occurred at
      MET 22822, 592 s beyond this contact's LOS. P3_stuck_load bottoms out at 60.009
      percent and P4_hk_generation_halt at 65.009 percent, so neither remaining pass
      reaches the ladder either. There is no pass in v0.1 to re-execute these steps on.
    disposition: owner_risk_acceptance
    accepted_by: Dan Lee-Odinson, design authority
    rationale: >-
      Ruled by Dan Lee-Odinson (Director), 2026-09-20. Accepted knowingly: PROC-002-S07
      and PROC-002-S08 go unexercised in v0.1, and with them the autonomous mode ladder
      that HUG-EPS-003 specifies and that PROC-002-S09 and S10 also depend on. The gap
      is carried into the next gate as a finding in its own right — that no scenario in
      the campaign drives EPS_BATT_SOC to the 30 percent LOW_POWER or 20 percent SAFE
      entry, so a core autonomous protection behaviour is asserted in the record and
      demonstrated by nothing.
