# PASS-2, contact B of two — RESPONSE.
#
# Companion record: 2026-09-20-P2a (detection). Per D-015 a pass may span two contacts;
# per the Director's ruling of 2026-09-20 the two are filed as two pass records threaded
# by one anomaly record.
#
# CONTACT DESIGNATION, per the Director's ruling of 2026-09-20: a pass flies a contact's
# DURATION, taken from the computed week, at a mission position the pass plan chooses.
# This contact is 430 s — the duration of computed contact 16 — flown at MET 21800.
# That position is CHOSEN, not orbit-derived: no contact of the computed week other than
# contact 1 has its acquisition inside this scenario's 23040 s, so no real contact exists
# where the limit is crossed. Reaching MET 21800 was made possible by the --start-at
# pre-roll built under D-015.
#
# CROSS-CONTACT INFERENCE, per the Director's ruling of 2026-09-20: PROC-002-S02 and S03
# are answered from contact A's observation, because in eclipse both string currents read
# 0.00 A and the asymmetry those steps test for is invisible here. Each such entry names
# the contact its evidence came from.

