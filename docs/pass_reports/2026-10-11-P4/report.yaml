# PASS-4 — HOUSEKEEPING GENERATION HALT. Single contact, PROC-001 with PROC-003 entered on
# the staleness annunciation.
#
# CONTACT DESIGNATION, per D-016 ruling 1: a pass flies a contact's DURATION, taken from
# the computed week, at a mission position the pass plan chooses. This contact is 430 s,
# the duration of computed contact 2, flown at MET 1100 to 1530. The pass plan
# (pass_plan.md, generated by tools/gen_pass_plan.py) is the same scenario with its fault
# removed, and is what every "against plan" value below is compared to.
#
# PROCEDURES VERSION 0.3. Under D-018 the staleness annunciator is CmdTlmServer's Log
# Messages list, and a staleness alarm at any point in the contact enters PROC-003, which
# hands back to PROC-001 at the step after the last one completed. This pass is the first
# flown on it.
#
# D-018 RULING 3 kept the scenario's own CMD_SYS_RESET at MET 1320. It restored telemetry
# at 20:06:02.682Z, 21.1 s before the operator's reset left the ground. The record says so
# at PROC-003-S03 to S05.

pass_id: 2026-10-11-P4
procedure: PROC-001
executed_utc: '2026-10-11T19:58:29Z'

pass_plan:
  window_aos_utc: '2026-10-11T20:02:22Z'
  window_los_utc: '2026-10-11T20:09:32Z'
  predicted_soc_pct: 72.896
  planned_commands: [CMD_SYS_RESET]

# NOTE on the window: the pass plan states the window in mission time, MET 1100 to 1530.
# The UTC values are that window as flown. AOS is derived from the first frame received
# (CDH_MET 1102 at 20:02:24.029Z) less two frames at the measured 1.0027 s mean frame
# interval before the halt; LOS is AOS plus the 430 s contact.
#
# NOTE on predicted_soc_pct: 72.896 is the pass plan's state of charge at MET 1100, the
# acquisition.
#
# NOTE on planned_commands: the campaign plan's one commanded activity for PASS-4 is
# CMD_SYS_RESET, the only command that clears the latched halt. The payload was already ON
# at acquisition by the scenario's scripted command at MET 120, so the pass plan contains
# no payload activation.

