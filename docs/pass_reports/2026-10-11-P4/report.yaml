          20:06:03.020Z, seen in Log Messages at 20:07:40Z. EPS_BATT_SOC was continuous with
          the value before the outage, 73.583 percent at MET 1199 and 74.424 at MET 1320,
          both on the pass plan. Returned to PROC-001 at S06.

      - step: PROC-003-S06
        state: not_applicable
        basis: >-
          PROC-003 was entered on the telemetry presentation. No command went
          unacknowledged: the one command sent, CMD_SYS_RESET, was accepted.
      - step: PROC-003-S07
        state: not_applicable
        basis: PROC-003-S06 not applicable; no command went unacknowledged
      - step: PROC-003-S08
        state: not_applicable
        basis: PROC-003-S07 not applicable; there was no unaccounted command to retry
      - step: PROC-003-S09
        state: not_applicable
        basis: PROC-003-S08 not applicable; there was no retry to judge

      - step: PROC-003-S10
        role: FD
        operator: Dan Lee-Odinson
        state: completed
        note: >-
          The anomaly is declared under anomalies below, and reported in full in
          docs/anomalies/AR-003-hk-generation-halt.md.

anomalies:
  - id: AR-003
    finding: >-
      Housekeeping generation halted at MET 1200 and stayed halted, latched, for 120 s,
      until the scenario's scripted CMD_SYS_RESET at MET 1320 restored it. The ground-side
      staleness monitor detected it, YELLOW then RED, on a link that stayed connected. The
      operator's reset was sent 21.1 s after the scripted one had restored telemetry. State
      of charge was preserved and matched the pass plan throughout. Full report:
      docs/anomalies/AR-003-hk-generation-halt.md.
