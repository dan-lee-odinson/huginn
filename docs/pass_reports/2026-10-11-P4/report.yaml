invoked_procedures:
  - procedure: PROC-003
    invoked_on: staleness
    resumed_at: PROC-001-S06
    completion_record:

      - step: PROC-003-S01
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        records: {last_frame_utc: '2026-10-11T20:04:01Z', last_cdh_frame_cnt: 1200,
                  staleness_level: YELLOW}
        note: >-
          The counter froze at 1200 in the frame received at 20:04:01.293Z, CDH_MET 1199.
          The operator watched it hold there in Packet Viewer from 20:04:05Z, and by
          20:04:35Z the whole packet showed in the stale color. The annunciator posted
          YELLOW at 20:04:11.899Z and RED at 20:04:31.918Z. YELLOW is the level the
          operator entered on. In his words: "I saw yellow first and went to type it in and
          it went to red before I sent". The recorder note "yellow" was entered at 20:05:17Z.
          The recorder captures the screen every 5 s, and its captures show Packet Viewer
          from 20:04:05Z to 20:04:40Z and CmdTlmServer from 20:04:45Z, so the look at
          YELLOW fell between captures.

      - step: PROC-003-S02
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        branch: spacecraft-side
        observation: >-
          The staleness annunciator, YELLOW at entry, read RED by the time of this step.
          HUGINN_INT read CONNECTED, and its Tlm pkts
          held at 152 and Rx bytes at 7600 on every screen captured from 20:04:45Z to
          20:05:45Z: an absence of frames on a live link. Neither NO_READ nor READ_FAULT was
          announced.

      - step: PROC-003-S03
        role: FD
        operator: Dan Lee-Odinson
        state: completed
        records: {reset_command_utc: '2026-10-11T20:06:24Z',
                  reset_command_utc_precise: '2026-10-11T20:06:23.790611Z',
                  cdh_met_at_send: 1341}
        note: >-
          Authorized on the spacecraft-side determination at S02. Command Sender opened on
          CMD_MODE_SET, the packet it held from an earlier session; the operator changed it
          to CMD_SYS_RESET by 20:06:05Z and sent it under the two-step confirmation. By then
          the scenario's own CMD_SYS_RESET at MET 1320 (D-018 ruling 3) had already restored
          telemetry: its first frame arrived at 20:06:02.682Z, 21.1 s before this command
          left the ground. The operator had not noticed the frames return; he was working in
          Command Sender. The simulator accepted the operator's reset at its next tick,
          MET 1342.

      - step: PROC-003-S04
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        records: {acc_cnt_post_reset: 1, rej_cnt_post_reset: 0, soc_pct_post_reset: 74.819}
        note: >-
          Read in Packet Viewer at 20:07:00Z, from the frame at CDH_MET 1377. The counters
          read ACC 1 and REJ 0 in every frame of the contact: before the halt, after the
          scenario's payload ON at MET 120; after the scenario's reset at MET 1320; and after
          the operator's at MET 1342. The epoch check therefore passed without telling a
          reset from no reset, as OF-028 predicted. The reset's evidence in this pass is
          frames resuming, the ground command log, and the simulator's count of one command
          uplinked. State of charge was preserved: 74.819 percent at MET 1377 lies on the
          pass plan between its 1370 and 1400 samples, both matched to the third decimal.

      - step: PROC-003-S05
        role: EPS
        operator: Dan Lee-Odinson
        state: completed
        branch: restored
        observation: >-
          CDH_FRAME_CNT advanced again from 1201 at CDH_MET 1320 with no further gap to LOS,
