# Campaign pass P1-ORB - the nominal pass with eclipse derived from the pinned orbit.
#
# The same shape as P1_nominal, but illumination comes from PROPAGATION of the pinned
# surrogate reference element set rather than from intervals stated in this file. That
# is what HUG-SYS-002 requires of a campaign pass: "derive eclipse state and
# ground-terminal visibility from that propagation".
#
# P1_nominal is retained alongside it and is not redundant: stating the eclipse boundary
# on an exact tick is how the HUG-EPS-002 ramp gets tested at the boundary, and keeping
# that path free of trigonometry is what lets the EPS and C&DH tests claim byte equality
# across machines as well as across runs (owner ruling D-003 item 4).
scenario_id: p1-nominal-orbit
description: Nominal activation pass with eclipse propagated from the pinned element set.
seed: 20260729
start_epoch_utc: '2026-07-29T00:00:00Z'
duration_s: 5760
initial:
  soc_pct: 70.0
  mode: NOMINAL
  payload_on: false
illumination:
  source: orbit
faults: []
commands:
  - t_s: 180
    mnemonic: CMD_PLD_SET_STATE
    args: {state: 'ON'}
  - t_s: 240
    mnemonic: CMD_PLD_SET_RATE
    args: {rate: 2.0}
