# Campaign pass P4, re-fly - housekeeping generation halt, fault (c) of HUG-EPS-004.
#
# Owner ruling D-021: the PASS-4 re-fly runs on this copy of P4_hk_generation_halt.
# The original is unchanged, so the PASS-4 record flown on it still reproduces from it.
# This copy differs in two places and nowhere else, which a test checks:
#
#   - One more command is accepted before the halt (CMD_PLD_SET_RATE at MET 600), so the
#     command counters read ACC 2, REJ 0 before the halt. The reset's epoch, ACC 1 and
#     REJ 0, then differs from them and shows that a reset happened. On the first
#     flight the counters read ACC 1, REJ 0 before the halt as well, and the epoch could
#     not tell a reset from no reset (OF-028).
#   - There is no scripted reset. The halt latches until CMD_SYS_RESET, so only the
#     operator's reset clears it; without one, no frame follows the halt. On the first
#     flight the scenario's own reset at MET 1320 restored telemetry before the
#     operator's did (AR-003). This replaces D-018 ruling 3 for the re-fly.
#
# FMEA FM-CDH-01: from onset no frames are generated or transmitted while the
# spacecraft truth state continues to evolve. The ground-side staleness monitor turns
# yellow at 10 s and red at 30 s (Dictionary note 1 - a halted counter cannot alarm
# itself). PROC-003 governs, escalating to CMD_SYS_RESET, which clears the fault,
# reinitialises the counters and preserves SoC (HUG-CMD-005).
#
# The reception gap in this pass is the evidence, and it is preserved rather than
# filled (replay_schema.md Sec. 5).
scenario_id: p4-hk-generation-halt-refly
